{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF4">
  <title>{% block title %}{% endblock %} · Givlah</title>
  <link rel="icon" href="{% static 'icons/favicon-32.png' %}" sizes="32x32">
  <link rel="stylesheet" href="{% static 'css/givlah.css' %}?v=native-2">
</head>
<body class="screen-status">
  <main class="page status-page">
    <section class="status-screen">
      <img src="{% static 'icons/icon-192.png' %}" alt="" width="76" height="76">
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="muted">{% block message %}{% endblock %}</p>
      <a class="button button-block" href="/">Go to Nearby</a>
    </section>
  </main>
</body>
</html>
